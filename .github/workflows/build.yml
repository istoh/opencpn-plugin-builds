name: Build OpenCPN plugins

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin name filter. Leave empty to build the entire catalog.'
        required: false
        default: DashboardSK
      target:
        description: Build target from targets.json
        required: true
        default: ubuntu-26.04-x64

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          PLUGIN_FILTER: ${{ inputs.plugin }}
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          args=(--matrix)
          if [[ -n "$PLUGIN_FILTER" ]]; then
            args+=(--match "$PLUGIN_FILTER")
          fi
          matrix=$(./fetch.sh "${args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          profile=$(python3 build-target.py show "$BUILD_TARGET")
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

  build:
    needs: catalog
    runs-on: ${{ fromJSON(needs.catalog.outputs.profile).runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enable ARM emulation
        if: fromJSON(needs.catalog.outputs.profile).qemu == true
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Fetch and build
        env:
          PLUGIN_REPO: ${{ matrix.repo }}
          PLUGIN_SOURCE: ${{ matrix.url }}
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          python fetch_repos.py --repo "$PLUGIN_REPO"
          test "$(git -C "$PLUGIN_REPO" remote get-url origin)" = "$PLUGIN_SOURCE"
          python build-target.py build "$BUILD_TARGET" "$PLUGIN_REPO"
      - name: Save package and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target }}-${{ matrix.repo }}
          path: dist/
          if-no-files-found: ignore
